<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capture o amor · Nathalie & Igor</title>
<meta name="description" content="Envie suas fotos do casamento de Nathalie & Igor">
<meta name="theme-color" content="#f7f5ef">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ====== CONFIGURAÇÃO ====== */
  /* A URL do Apps Script fica no <script> lá embaixo (SCRIPT_URL). */

  :root{
    --bg:#f7f5ef;
    --card:#fffefb;
    --ink:#3d3d3a;
    --muted:#77766f;
    --sage:#8f9d6f;
    --sage-dark:#6f7d52;
    --line:#d9dccb;
    --danger:#b5524a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Quicksand',system-ui,sans-serif;
    min-height:100vh;
    padding:24px 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative;
    max-width:460px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:36px 24px 28px;
    box-shadow:0 10px 30px rgba(80,90,60,.08);
    overflow:hidden;
  }
  .card::before{ /* moldura fina como na plaquinha */
    content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:3px;pointer-events:none;
  }
  .flowers{position:absolute;pointer-events:none;opacity:.9}
  .flowers.tr{top:-6px;right:-14px;width:120px}
  .flowers.bl{bottom:-10px;left:-18px;width:110px;transform:scaleX(-1) rotate(8deg)}

  header{text-align:center;position:relative}
  .couple{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:38px;letter-spacing:.04em;margin:0;line-height:1}
  .script{font-family:'Allura',cursive;color:var(--sage);font-size:50px;line-height:1.1;margin:2px 0 10px}
  .lead{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.35;margin:0 auto;max-width:300px}
  .rule{width:70%;height:1px;background:var(--ink);opacity:.5;margin:18px auto 20px;border:0}

  details.challenges{margin:0 4px 22px;position:relative}
  details.challenges summary{cursor:pointer;list-style:none;text-align:center;font-weight:600;color:var(--sage-dark);font-size:14px}
  details.challenges summary::-webkit-details-marker{display:none}
  details.challenges summary::after{content:" ▾"}
  details[open].challenges summary::after{content:" ▴"}
  .challenges ul{list-style:none;padding:0;margin:14px 0 0}
  .challenges li{display:flex;align-items:center;gap:10px;font-size:15px;margin:9px 0}
  .heart{flex:none;width:22px;height:22px}

  form{position:relative;display:grid;gap:16px}
  label.field{display:grid;gap:6px;font-size:14px;font-weight:600}
  label.field span small{font-weight:400;color:var(--muted)}
  input[type=text],textarea{
    font:inherit;font-size:16px; /* 16px evita zoom no iPhone */
    padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;
  }
  textarea{min-height:84px;resize:vertical}
  input[type=text]:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px;border-color:transparent}

  .picker{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border:2px dashed var(--sage);border-radius:14px;padding:22px 12px;text-align:center;cursor:pointer;
    background:#fbfcf7;color:var(--sage-dark);font-weight:600;
  }
  .picker svg{width:38px;height:38px}
  .picker small{color:var(--muted);font-weight:400}
  #files{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
  .thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;
    background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:24px;padding:0;cursor:pointer;
  }
  .thumb .state{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:rgba(255,255,255,.55);
  }

  .btn{
    font:inherit;font-weight:600;font-size:17px;border:0;border-radius:999px;padding:15px 20px;cursor:pointer;
    background:var(--sage);color:#fff;width:100%;transition:background .2s;
  }
  .btn:hover{background:var(--sage-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;color:var(--sage-dark);border:1.5px solid var(--sage)}

  .progress{height:8px;background:#ecefe3;border-radius:999px;overflow:hidden;display:none}
  .progress div{height:100%;width:0;background:var(--sage);transition:width .3s}
  .status{text-align:center;font-size:14px;color:var(--muted);min-height:1.2em;margin:0}
  .status.error{color:var(--danger)}

  .done{display:none;text-align:center;position:relative;padding:10px 0}
  .done .big{font-size:56px;margin:0}
  .done h2{font-family:'Allura',cursive;font-weight:400;color:var(--sage);font-size:44px;margin:4px 0}
  .done p{margin:0 0 20px}

  footer{text-align:center;font-family:'Cormorant Garamond',serif;color:var(--muted);font-size:15px;margin-top:22px;line-height:1.4}
  .monogram{font-family:'Allura',cursive;font-size:30px;color:var(--ink);display:block;margin-top:6px}
</style>
</head>
<body>

<main class="card">
  <!-- Flores decorativas -->
  <svg class="flowers tr" viewBox="0 0 120 160" aria-hidden="true">
    <g stroke="#9aab7c" stroke-width="1.4" fill="none">
      <path d="M95 160 C 90 110, 80 80, 70 40"/><path d="M100 160 C 105 120, 108 90, 104 55"/><path d="M88 160 C 70 130, 55 110, 40 95"/>
    </g>
    <g fill="#f2cf5b"><circle cx="70" cy="34" r="7"/><circle cx="62" cy="28" r="7"/><circle cx="78" cy="28" r="7"/><circle cx="66" cy="20" r="7"/><circle cx="76" cy="20" r="7"/></g>
    <circle cx="71" cy="26" r="4" fill="#c9a23a"/>
    <g fill="#7f9ad6"><circle cx="104" cy="50" r="5"/><circle cx="98" cy="44" r="4"/><circle cx="108" cy="40" r="4"/><circle cx="102" cy="34" r="3.5"/></g>
    <g fill="#e07d98"><ellipse cx="38" cy="92" rx="9" ry="5" transform="rotate(-30 38 92)"/><ellipse cx="34" cy="84" rx="7" ry="4" transform="rotate(-70 34 84)"/><ellipse cx="44" cy="86" rx="7" ry="4" transform="rotate(10 44 86)"/></g>
    <g fill="#b9c7e8"><circle cx="20" cy="60" r="3"/><circle cx="26" cy="56" r="2.5"/><circle cx="16" cy="54" r="2.5"/></g>
  </svg>
  <svg class="flowers bl" viewBox="0 0 120 160" aria-hidden="true">
    <g stroke="#9aab7c" stroke-width="1.4" fill="none">
      <path d="M95 160 C 90 120, 85 95, 78 70"/><path d="M100 160 C 104 130, 106 110, 100 90"/>
    </g>
    <g fill="#e07d98"><ellipse cx="78" cy="66" rx="10" ry="6" transform="rotate(-30 78 66)"/><ellipse cx="72" cy="58" rx="8" ry="4.5" transform="rotate(-70 72 58)"/><ellipse cx="86" cy="60" rx="8" ry="4.5" transform="rotate(15 86 60)"/></g>
    <g fill="#7f9ad6"><circle cx="100" cy="86" r="5"/><circle cx="95" cy="80" r="4"/><circle cx="104" cy="77" r="4"/></g>
  </svg>

  <section id="formView">
    <header>
      <p class="couple">Nathalie &amp; Igor</p>
      <h1>DESAFIO:</h1>
      <p class="script">Capture o amor</p>
      <p class="lead">Use a câmera sem medo, capture o amor em segredo!</p>
      <hr class="rule">
    </header>

    <details class="challenges">
      <summary>Ver a lista do desafio</summary>
      <ul id="challengeList"></ul>
    </details>

    <form id="form" novalidate>
      <label class="field">
        <span>Seu nome <small>(opcional)</small></span>
        <input type="text" id="name" maxlength="80" autocomplete="name" placeholder="Como os noivos te conhecem">
      </label>

      <label class="field">
        <span>Mensagem para os noivos <small>(opcional)</small></span>
        <textarea id="message" maxlength="1000" placeholder="Deixe um recado carinhoso…"></textarea>
      </label>

      <div>
        <label class="picker" for="files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/>
          </svg>
          Tirar ou escolher fotos
          <small>Pode escolher várias de uma vez</small>
        </label>
        <input type="file" id="files" accept="image/*" multiple>
      </div>

      <div class="thumbs" id="thumbs"></div>

      <div class="progress" id="progress"><div></div></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <button class="btn" id="send" type="submit" disabled>Enviar fotos</button>
    </form>
  </section>

  <section class="done" id="doneView">
    <p class="big">💚</p>
    <h2>Obrigado!</h2>
    <p id="doneText">Suas fotos chegaram para a Nathalie e o Igor.</p>
    <button class="btn ghost" id="again" type="button">Enviar mais fotos</button>
  </section>

  <footer>
    Use seu olhar para encontrar momentos<br>incríveis que talvez ninguém mais veja.
    <span class="monogram">N &amp; I</span>
  </footer>
</main>

<script>
/* ===================== CONFIGURAÇÃO ===================== */
// Cole aqui a URL do Web App do Google Apps Script (termina em /exec)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGep6k05SriMvj1uxIkaKxQQkxJFrp6nv9vmtpUVfmgVtuFGc76a_I-rHfFdtyLgXWiw/exec';

const MAX_SIDE = 2000;      // lado maior da foto após compressão (px)
const JPEG_QUALITY = 0.85;
const MAX_FILES = 30;       // máximo por envio
const MAX_RAW_MB = 25;      // fotos que não puderem ser comprimidas acima disso são recusadas

const CHALLENGES = [
  'Uma foto em grupo da sua mesa',
  'Um momento engraçado',
  'Os noivos se beijando',
  'Sorrisos',
  'Alguém fazendo um brinde',
  'Os mais velhos se divertindo',
  'O melhor momento na pista de dança',
  'Uma selfie engraçada',
];
/* ======================================================== */

const $ = (id) => document.getElementById(id);
const heartSvg = '<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#8f9d6f" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4l1 .1c.7-1.3 2.2-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/><path d="M8 12.2l2.6 2.6L16 9.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
$('challengeList').innerHTML = CHALLENGES.map(c => `<li>${heartSvg}<span>${c}</span></li>`).join('');

let selected = []; // { file, url, el }
let sending = false;

$('files').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  for (const file of files) {
    if (selected.length >= MAX_FILES) { setStatus(`Máximo de ${MAX_FILES} fotos por envio.`, true); break; }
    addThumb(file);
  }
  e.target.value = '';
  updateButton();
});

function addThumb(file) {
  const url = URL.createObjectURL(file);
  const el = document.createElement('div');
  el.className = 'thumb';
  el.innerHTML = `<img alt="">`;
  const img = el.querySelector('img');
  img.src = url;
  img.onerror = () => { img.replaceWith(Object.assign(document.createElement('div'), {className:'state', textContent:'📷'})); };
  const rm = document.createElement('button');
  rm.type = 'button'; rm.setAttribute('aria-label', 'Remover foto'); rm.textContent = '×';
  const item = { file, url, el };
  rm.onclick = () => {
    if (sending) return;
    selected = selected.filter(s => s !== item);
    URL.revokeObjectURL(url); el.remove(); updateButton();
  };
  el.appendChild(rm);
  $('thumbs').appendChild(el);
  selected.push(item);
}

function updateButton() {
  const n = selected.length;
  $('send').disabled = sending || n === 0;
  $('send').textContent = n === 0 ? 'Enviar fotos' : `Enviar ${n} foto${n > 1 ? 's' : ''}`;
  if (n && !sending) setStatus('');
}

function setStatus(text, isError = false) {
  $('status').textContent = text;
  $('status').classList.toggle('error', isError);
}

function setProgress(fraction) {
  $('progress').style.display = 'block';
  $('progress').firstElementChild.style.width = Math.round(fraction * 100) + '%';
}

// Reduz a foto no próprio celular antes de enviar (envio mais rápido no 4G)
async function compress(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    bmp.close && bmp.close();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', JPEG_QUALITY));
    if (!blob) throw new Error('toBlob falhou');
    return { blob, mimeType: 'image/jpeg', ext: 'jpg' };
  } catch {
    // Navegador não conseguiu decodificar (ex.: HEIC em alguns Androids): envia o original
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    return { blob: file, mimeType: file.type || 'application/octet-stream', ext };
  }
}

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function uploadOne(item, meta, attempt = 1) {
  const { blob, mimeType, ext } = await compress(item.file);
  if (blob.size > MAX_RAW_MB * 1024 * 1024) throw new Error('Foto grande demais');
  const data = await toBase64(blob);
  try {
    // text/plain evita o "preflight" de CORS, que o Apps Script não responde
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...meta, mimeType, ext, data }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Erro no servidor');
  } catch (err) {
    if (attempt < 3) {
      await new Promise(r => setTimeout(r, 1500 * attempt));
      return uploadOne(item, meta, attempt + 1);
    }
    throw err;
  }
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!selected.length || sending) return;
  if (SCRIPT_URL.startsWith('COLE_AQUI')) { setStatus('Configure a SCRIPT_URL no index.html.', true); return; }

  sending = true; updateButton();
  const batch = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const name = $('name').value.trim();
  const message = $('message').value.trim();
  const total = selected.length;
  let done = 0, failed = [];

  setProgress(0);
  for (const [i, item] of selected.entries()) {
    setStatus(`Enviando foto ${i + 1} de ${total}…`);
    const badge = Object.assign(document.createElement('div'), { className: 'state', textContent: '⏳' });
    item.el.appendChild(badge);
    try {
      await uploadOne(item, { name, message, batch, index: i + 1, total });
      badge.textContent = '✅';
      done++;
    } catch {
      badge.textContent = '⚠️';
      failed.push(item);
    }
    setProgress((i + 1) / total);
  }

  sending = false;
  if (failed.length === 0) {
    $('doneText').textContent = done === 1
      ? 'Sua foto chegou para a Nathalie e o Igor.'
      : `Suas ${done} fotos chegaram para a Nathalie e o Igor.`;
    $('formView').style.display = 'none';
    $('doneView').style.display = 'block';
    reset();
  } else {
    // Mantém só as que falharam, para tentar de novo
    selected.filter(s => !failed.includes(s)).forEach(s => { URL.revokeObjectURL(s.url); s.el.remove(); });
    selected = failed;
    failed.forEach(s => s.el.querySelector('.state')?.remove());
    updateButton();
    $('send').textContent = `Tentar de novo (${failed.length})`;
    setStatus(`${done} enviada(s). ${failed.length} não foi(ram) — verifique a internet e toque em "Tentar de novo".`, true);
  }
});

function reset() {
  selected.forEach(s => URL.revokeObjectURL(s.url));
  selected = [];
  $('thumbs').innerHTML = '';
  $('message').value = '';
  $('progress').style.display = 'none';
  setStatus('');
  updateButton();
}

$('again').addEventListener('click', () => {
  $('doneView').style.display = 'none';
  $('formView').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
